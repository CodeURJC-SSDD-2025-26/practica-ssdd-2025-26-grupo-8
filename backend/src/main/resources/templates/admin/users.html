<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Virtus Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin-users.css}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-lightning-charge-fill text-warning"></i> Virtus Fitness
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Admin</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/admin/users}">Usuarios</a></li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline ms-1">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="admin-page">
        <div class="admin-page-header">
            <div class="container">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Administración</a></li>
                        <li class="breadcrumb-item active">Usuarios</li>
                    </ol>
                </nav>
                <h1><i class="bi bi-people-fill"></i> Gestión de Usuarios</h1>
            </div>
        </div>

        <div class="container">

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Stat Cards -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-card-icon"><i class="bi bi-people-fill"></i></div>
                        <div class="stat-card-info"><p>Total Usuarios</p><h3 th:text="${totalUsers}">0</h3></div>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="admin-container">
                <div class="admin-toolbar">
                    <h2><i class="bi bi-list-ul"></i> Listado de Usuarios</h2>
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Buscar usuario..." oninput="filterUsers()">
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table class="users-table" id="usersTable">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Plan</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td>
                                    <div class="user-cell">
                                        <div class="user-avatar" th:text="${#strings.substring(u.username, 0, 2).toUpperCase()}">US</div>
                                        <div>
                                            <div class="user-name" th:text="${u.username}">Nombre</div>
                                            <div class="user-id" th:text="'#' + ${u.id}">#ID</div>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${u.email}">email</td>
                                <td>
                                    <span class="role-badge role-admin" th:if="${u.role == 'ROLE_ADMIN'}">
                                        <i class="bi bi-shield-check"></i> Admin
                                    </span>
                                    <span class="role-badge role-user" th:unless="${u.role == 'ROLE_ADMIN'}">
                                        <i class="bi bi-person"></i> Usuario
                                    </span>
                                </td>
                                <td>
                                    <span class="plan-badge plan-premium" th:if="${u.planType == 'Premium'}">Premium</span>
                                    <span class="plan-badge plan-elite" th:if="${u.planType == 'Elite'}">Elite</span>
                                    <span class="plan-badge plan-basic" th:if="${u.planType == 'Básico'}">Básico</span>
                                </td>
                                <td>
                                    <div class="action-buttons">
                                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar al usuario ' + '[[${u.username}]]' + '?')">
                                            <button type="submit" class="btn-action btn-delete">
                                                <i class="bi bi-trash"></i>Eliminar
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="table-footer">
                    <p id="tableCount" th:text="'Mostrando ' + ${totalUsers} + ' usuarios'">Usuarios</p>
                    <a th:href="@{/admin/classes}" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-grid me-1"></i>Gestión de Clases
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#usersTable tbody tr');
            let visible = 0;
            rows.forEach(row => {
                const show = row.textContent.toLowerCase().includes(query);
                row.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            document.getElementById('tableCount').textContent = `Mostrando ${visible} usuarios`;
        }
    </script>
</body>
</html>
