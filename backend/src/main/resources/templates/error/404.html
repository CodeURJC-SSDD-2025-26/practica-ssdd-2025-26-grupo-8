<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Virtus Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body { background: #080808; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .error-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6rem 1rem; }
        .error-code { font-size: 8rem; font-weight: 900; color: #C8FF00; line-height: 1; }
        .error-title { font-size: 2rem; font-weight: 700; margin: 1rem 0; }
        .error-text { color: #888; margin-bottom: 2rem; }
        .btn-home { background: #C8FF00; color: #080808; font-weight: 700; padding: 0.75rem 2rem; border-radius: 4px; text-decoration: none; display: inline-block; }
        .btn-home:hover { background: #b5e600; color: #080808; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-lightning-charge-fill text-warning"></i> Virtus Fitness
            </a>
        </div>
    </nav>

    <div class="error-page">
        <div class="text-center">
            <div class="error-code">404</div>
            <h1 class="error-title">Página no encontrada</h1>
            <p class="error-text">La página que buscas no existe o ha sido movida.</p>
            <a th:href="@{/}" class="btn-home">
                <i class="bi bi-house me-2"></i>Volver al Inicio
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer bg-dark text-white py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Virtus Fitness. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
