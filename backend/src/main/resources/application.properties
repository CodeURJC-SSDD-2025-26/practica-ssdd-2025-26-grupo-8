# ============================================================
# Virtus Fitness - application.properties
# ============================================================

# --- HTTPS / SSL ---
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=virtusfitness
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=virtus

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/virtusdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Multipart (avatar / class images) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Logging ---
logging.level.org.springframework.security=WARN
logging.level.es.urjc.virtusfitness=INFO
