<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Virtus Fitness - Regístrate para comenzar tu transformación">
    <title>Registro - Virtus Fitness</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Authentication Pages CSS -->
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body>

    <div class="auth-page">

        <!-- Panel izquierdo: Marca -->
        <div class="auth-brand-panel">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <a href="index.html" class="back-to-home">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>
                <div class="brand-center">
                    <div class="brand-logo">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </div>
                    <h1 class="brand-name">Virtus Fitness</h1>
                    <p class="brand-tagline">Únete a nuestra comunidad y empieza tu transformación hoy</p>
                </div>
                <div class="brand-stats">
                    <div class="brand-stat">
                        <strong>1879+</strong>
                        <span>Miembros</span>
                    </div>
                    <div class="brand-stat-divider"></div>
                    <div class="brand-stat">
                        <strong>25</strong>
                        <span>Entrenadores</span>
                    </div>
                    <div class="brand-stat-divider"></div>
                    <div class="brand-stat">
                        <strong>16</strong>
                        <span>Años</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel derecho: Formulario -->
        <div class="auth-form-panel">
            <div class="form-panel-inner" style="max-width: 460px;">

                <div class="form-header">
                    <h2>Crear cuenta</h2>
                    <p>Completa tus datos para unirte a Virtus Fitness</p>
                </div>

                <form id="registerForm" onsubmit="return simulateRegister(event)" novalidate>

                    <!-- Foto de perfil -->
                    <div class="photo-upload-section">
                        <div class="photo-preview-wrapper">
                            <div class="photo-preview" id="photoPreview">
                                <i class="bi bi-person-fill"></i>
                            </div>
                            <label for="profilePhoto" class="photo-upload-btn">
                                <i class="bi bi-camera-fill"></i>
                            </label>
                            <input type="file" id="profilePhoto" accept="image/*" hidden>
                        </div>
                        <p class="photo-hint">Foto de perfil (opcional)</p>
                    </div>

                    <!-- Nombre -->
                    <div class="field-group">
                        <label for="name">Nombre completo</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-person field-icon"></i>
                            <input type="text" id="name" placeholder="Tu nombre y apellidos" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="field-group">
                        <label for="email">Correo electrónico</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-envelope field-icon"></i>
                            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="field-group">
                        <label for="password">Contraseña</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-lock field-icon"></i>
                            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button type="button" class="toggle-password" tabindex="-1" onclick="
                                var inp = document.getElementById('password');
                                var icon = this.querySelector('i');
                                if (inp.type === 'password') {
                                    inp.type = 'text';
                                    icon.className = 'bi bi-eye-slash';
                                } else {
                                    inp.type = 'password';
                                    icon.className = 'bi bi-eye';
                                }
                            ">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <!-- Barra de fuerza de contraseña -->
                        <div class="strength-bar-wrapper">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                    </div>

                    <!-- Confirmar contraseña -->
                    <div class="field-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-lock field-icon"></i>
                            <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required minlength="6">
                            <button type="button" class="toggle-password" tabindex="-1" onclick="
                                var inp = document.getElementById('confirmPassword');
                                var icon = this.querySelector('i');
                                if (inp.type === 'password') {
                                    inp.type = 'text';
                                    icon.className = 'bi bi-eye-slash';
                                } else {
                                    inp.type = 'password';
                                    icon.className = 'bi bi-eye';
                                }
                            ">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Términos y newsletter -->
                    <div class="checks-section">
                        <label class="custom-check">
                            <input type="checkbox" id="termsCheck" required>
                            <span class="checkmark"></span>
                            Acepto los <a href="#" onclick="return false;">Términos y Condiciones</a> y la <a href="#" onclick="return false;">Política de Privacidad</a>
                        </label>
                        <label class="custom-check mt-2">
                            <input type="checkbox" id="newsletterCheck" checked>
                            <span class="checkmark"></span>
                            Quiero recibir ofertas y novedades por email
                        </label>
                    </div>

                    <!-- Botón de registro -->
                    <button type="submit" class="btn-auth">
                        Crear cuenta <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </form>

                <!-- Divisor -->
                <div class="auth-divider"><span>o regístrate con</span></div>

                <!-- Google -->
                <button class="btn-google">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continuar con Google
                </button>

                <!-- Enlace de login -->
                <p class="auth-switch-link">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </p>

            </div>
        </div>

    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>

    <script src="js/register.js"></script>

</body>
</html>
