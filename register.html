<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Virtus Fitness - Regístrate para comenzar tu transformación">
    <title>Registro - Virtus Fitness</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Authentication Pages CSS -->
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body>

    <div class="auth-page">

        <!-- Panel izquierdo: Marca -->
        <div class="auth-brand-panel">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <a href="index.html" class="back-to-home">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>
                <div class="brand-center">
                    <div class="brand-logo">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </div>
                    <h1 class="brand-name">Virtus Fitness</h1>
                    <p class="brand-tagline">Únete a nuestra comunidad y empieza tu transformación hoy</p>
                </div>
                <div class="brand-stats">
                    <div class="brand-stat">
                        <strong>1879+</strong>
                        <span>Miembros</span>
                    </div>
                    <div class="brand-stat-divider"></div>
                    <div class="brand-stat">
                        <strong>25</strong>
                        <span>Entrenadores</span>
                    </div>
                    <div class="brand-stat-divider"></div>
                    <div class="brand-stat">
                        <strong>16</strong>
                        <span>Años</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel derecho: Formulario -->
        <div class="auth-form-panel">
            <div class="form-panel-inner" style="max-width: 460px;">

                <div class="form-header">
                    <h2>Crear cuenta</h2>
                    <p>Completa tus datos para unirte a Virtus Fitness</p>
                </div>

                <form id="registerForm" onsubmit="return simulateRegister(event)" novalidate>

                    <!-- Foto de perfil -->
                    <div class="photo-upload-section">
                        <div class="photo-preview-wrapper">
                            <div class="photo-preview" id="photoPreview">
                                <i class="bi bi-person-fill"></i>
                            </div>
                            <label for="profilePhoto" class="photo-upload-btn">
                                <i class="bi bi-camera-fill"></i>
                            </label>
                            <input type="file" id="profilePhoto" accept="image/*" hidden>
                        </div>
                        <p class="photo-hint">Foto de perfil (opcional)</p>
                    </div>

                    <!-- Nombre -->
                    <div class="field-group">
                        <label for="name">Nombre completo</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-person field-icon"></i>
                            <input type="text" id="name" placeholder="Tu nombre y apellidos" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="field-group">
                        <label for="email">Correo electrónico</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-envelope field-icon"></i>
                            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="field-group">
                        <label for="password">Contraseña</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-lock field-icon"></i>
                            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button type="button" class="toggle-password" tabindex="-1" onclick="
                                var inp = document.getElementById('password');
                                var icon = this.querySelector('i');
                                if (inp.type === 'password') {
                                    inp.type = 'text';
                                    icon.className = 'bi bi-eye-slash';
                                } else {
                                    inp.type = 'password';
                                    icon.className = 'bi bi-eye';
                                }
                            ">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <!-- Barra de fuerza de contraseña -->
                        <div class="strength-bar-wrapper">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                    </div>

                    <!-- Confirmar contraseña -->
                    <div class="field-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-lock field-icon"></i>
                            <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required minlength="6">
                            <button type="button" class="toggle-password" tabindex="-1" onclick="
                                var inp = document.getElementById('confirmPassword');
                                var icon = this.querySelector('i');
                                if (inp.type === 'password') {
                                    inp.type = 'text';
                                    icon.className = 'bi bi-eye-slash';
                                } else {
                                    inp.type = 'password';
                                    icon.className = 'bi bi-eye';
                                }
                            ">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Términos y newsletter -->
                    <div class="checks-section">
                        <label class="custom-check">
                            <input type="checkbox" id="termsCheck" required>
                            <span class="checkmark"></span>
                            Acepto los <a href="#" onclick="return false;">Términos y Condiciones</a> y la <a href="#" onclick="return false;">Política de Privacidad</a>
                        </label>
                        <label class="custom-check mt-2">
                            <input type="checkbox" id="newsletterCheck" checked>
                            <span class="checkmark"></span>
                            Quiero recibir ofertas y novedades por email
                        </label>
                    </div>

                    <!-- Botón de registro -->
                    <button type="submit" class="btn-auth">
                        Crear cuenta <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </form>

                <!-- Enlace de login -->
                <p class="auth-switch-link">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </p>

            </div>
        </div>

    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>

    <script src="js/register.js"></script>

</body>
</html>
