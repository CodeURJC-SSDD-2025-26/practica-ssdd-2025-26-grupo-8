# ============================================================
# Virtus Fitness - app-service (web + REST API)
# ------------------------------------------------------------
# Every value below can be overridden with an environment
# variable. The defaults match a local dev setup
# (MySQL on localhost, utility-service on localhost:8080).
# ============================================================
spring.application.name=app-service

# --- HTTPS / SSL ---
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=selfsigned

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/virtusdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Mustache / Thymeleaf cache (left as-is from Práctica 2) ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Multipart (avatar / class images) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Logging ---
logging.level.org.springframework.security=WARN
logging.level.es.urjc.virtusfitness=INFO

# --- utility-service location ---
utility-service.url=${UTILITY_SERVICE_URL:http://localhost:8080}

# --- Pagination (1-based page index as stated in the rubric: ?page=1 = first page) ---
spring.data.web.pageable.one-indexed-parameters=true

# --- JWT ---
jwt.secret=${JWT_SECRET:virtusfitness-jwt-secret-key-for-signing-tokens-2024-ssdd}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
