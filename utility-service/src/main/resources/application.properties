# ============================================================
# Virtus Fitness - utility-service
# ------------------------------------------------------------
# Plain HTTP on port 8080. No persistence layer, no security:
# the service is internal to the cluster and stateless.
# ============================================================
spring.application.name=utility-service

server.port=8080
server.ssl.enabled=false

# --- Multipart / response sizing ---
# Allow larger requests/responses since PDFs can grow with attachments.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Logging ---
logging.level.es.urjc.virtusfitness.utility=INFO

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
