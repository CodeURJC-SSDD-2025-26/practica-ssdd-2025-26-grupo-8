<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Virtus Fitness - Inicia sesión para acceder a tu cuenta">
    <title>Iniciar Sesión - Virtus Fitness</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Authentication Pages CSS -->
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body>

    <div class="auth-page">

        <!-- Panel izquierdo: Marca -->
        <div class="auth-brand-panel">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <a href="index.html" class="back-to-home">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>
                <div class="brand-center">
                    <div class="brand-logo">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </div>
                    <h1 class="brand-name">Virtus Fitness</h1>
                    <p class="brand-tagline">Transforma tu cuerpo y mente con los mejores profesionales</p>
                </div>
                <div class="brand-stats">
                    <div class="brand-stat">
                        <strong>1879+</strong>
                        <span>Miembros</span>
                    </div>
                    <div class="brand-stat-divider"></div>
                    <div class="brand-stat">
                        <strong>25</strong>
                        <span>Entrenadores</span>
                    </div>
                    <div class="brand-stat-divider"></div>
                    <div class="brand-stat">
                        <strong>16</strong>
                        <span>Años</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel derecho: Formulario -->
        <div class="auth-form-panel">
            <div class="form-panel-inner">

                <div class="form-header">
                    <h2>Bienvenido de nuevo</h2>
                    <p>Introduce tus credenciales para acceder a tu cuenta</p>
                </div>

                <form id="loginForm" onsubmit="return simulateLogin(event)" novalidate>

                    <!-- Email -->
                    <div class="field-group">
                        <label for="username">Correo electrónico</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-envelope field-icon"></i>
                            <input type="email" id="username" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="field-group">
                        <label for="password">Contraseña</label>
                        <div class="field-input-wrapper">
                            <i class="bi bi-lock field-icon"></i>
                            <input type="password" id="password" placeholder="Tu contraseña" required>
                            <button type="button" class="toggle-password" tabindex="-1" onclick="togglePassword(this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Recordarme / Contraseña olvidada -->
                    <div class="remember-forgot">
                        <label class="custom-check">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Recordarme
                        </label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Botón de acceso -->
                    <button type="submit" class="btn-auth">
                        Iniciar Sesión <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </form>

                <!-- Enlace de registro -->
                <p class="auth-switch-link">
                    ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
                </p>

            </div>
        </div>

    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
